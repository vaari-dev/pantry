[project]
name = "pantry"
version = "0.1.0"
description = "Pantry: groceries from a Telegram voice note"
requires-python = ">=3.13"
dependencies = ["structlog>=25"]

[project.optional-dependencies]
runtime = [
  "anthropic==1.13.0",
  "faster-whisper==1.2.1",
  "av>=13,<14",  # faster-whisper passes an option that av 14 removed
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S310", "SIM905", "RUF001", "RUF003"]  # tests; fixed https URLs; word lists; ₹ and × intended

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
pythonpath = ["src"]
