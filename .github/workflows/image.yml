name: Image

# A PR that changes what goes into the image proves it still builds. Code-only PRs skip this:
# the deploy builds the image anyway, and main can't read caches written by PR branches.
on:
  pull_request:
    paths: [Dockerfile, .dockerignore, pyproject.toml, 'docker/**', .github/workflows/image.yml]

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    timeout-minutes: 30
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          outputs: type=cacheonly
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
