name: Operate
run-name: ${{ inputs.action }}

# Day-two tasks on the box, so nobody needs to SSH in by hand.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options:
          - check            # home exit, each account's login and address
          - logs             # the bot's recent log lines and health
          - apimap           # the shop's API calls seen so far, without values
          - remove           # stop the bot and delete everything on the box, data included
      confirm:
        description: Type the action name again to confirm "remove"
        required: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  run:
    timeout-minutes: 15  # `remove` stops the bot, which may finish an order first
    runs-on: ubuntu-24.04-arm
    environment: oracle-cloud
    env:
      DIR: ${{ vars.DEPLOY_DIR || '/opt/grocery-bot' }}
      ACTION: ${{ inputs.action }}
    steps:
      - if: inputs.action == 'remove' && inputs.confirm != 'remove'
        run: |
          echo "::error::Type 'remove' in confirm to delete the bot and its data." >&2
          exit 1
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/box
        with:
          host: ${{ vars.SSH_HOST }}
          user: ${{ vars.SSH_USER }}
          known-hosts: ${{ vars.SSH_KNOWN_HOSTS }}
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - run: ssh box "'$DIR/box.sh' $ACTION"
