name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'site/**', .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  image:  # builds while checks run; deploy needs both
    timeout-minutes: 30
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    needs: [checks, image]
    timeout-minutes: 30  # pull, a 10 minute stop, 6 minutes of health checks
    runs-on: ubuntu-24.04-arm
    environment: oracle-cloud
    permissions:
      contents: read
      packages: read
    env:
      DIR: ${{ vars.DEPLOY_DIR || '/opt/pantry' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/box
        with:
          host: ${{ vars.SSH_HOST }}
          user: ${{ vars.SSH_USER }}
          known-hosts: ${{ vars.SSH_KNOWN_HOSTS }}
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Write the bot's settings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ vars.TELEGRAM_ADMIN_ID }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          required=(TELEGRAM_BOT_TOKEN TELEGRAM_ADMIN_ID ANTHROPIC_API_KEY)
          names=("${required[@]}" LOG_LEVEL)
          for name in "${required[@]}"; do
            [ -n "${!name}" ] || { echo "::error::$name is unset in the oracle-cloud environment." >&2; exit 1; }
          done
          (umask 077; for name in "${names[@]}"; do printf '%s=%s\n' "$name" "${!name}"; done > bot.env)

      - name: Prepare the box (Docker and the deploy directory, first time only)
        run: |
          ssh box 'command -v docker >/dev/null || { curl -fsSL https://get.docker.com | sudo sh && sudo usermod -aG docker "$USER"; }'
          ssh box "[ -w '$DIR' ] || sudo install -d -m 700 -o \"\$USER\" '$DIR'"

      - name: Ship config
        run: |
          scp -q compose.yaml scripts/box.sh box:"$DIR/"
          scp -q bot.env box:"$DIR/.env"
          ssh box "chmod 600 '$DIR/.env' && chmod 700 '$DIR/box.sh'"
          rm bot.env

      - name: Pull and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          # The box logs in to ghcr only for this pull; the short-lived token is not kept.
          printf '%s' "$GHCR_TOKEN" | ssh box "docker login ghcr.io -u '$ACTOR' --password-stdin" >/dev/null
          trap 'ssh box "docker logout ghcr.io" >/dev/null' EXIT
          ssh box "'$DIR/box.sh' deploy '$IMAGE:${{ needs.image.outputs.tag }}'"

      - name: Self-check
        run: ssh box "'$DIR/box.sh' check"
