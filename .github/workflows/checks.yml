name: Checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test:
    timeout-minutes: 10
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: No personal data or secrets
        run: |
          if git grep -nIE '(\+91[ -]?[0-9]{5}|bot[0-9]{8,}:[A-Za-z0-9_-]{30,}|tskey-[a-z]+-[A-Za-z0-9]{10,})' -- ':!*.md'; then exit 1; fi
          if git ls-files | grep -E '(^|/)(\.env|session\.json)$'; then exit 1; fi
      - name: Workflows
        # SC2029: `ssh box "$DIR/..."` expands on the runner on purpose
        run: docker run --rm -e SHELLCHECK_OPTS='-e SC2029' -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
