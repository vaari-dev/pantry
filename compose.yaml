name: grocery-bot

services:
  grocery-bot:  # Loki service_name
    image: ${APP_IMAGE:-grocery-bot:local}
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Kolkata  # daily cap, health check
    volumes:
      - data:/data
    shm_size: 1gb       # Chrome
    mem_limit: 3g
    # Not read_only: Chrome needs a writable root.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    stop_grace_period: 10m  # SIGTERM: the bot finishes queued orders, then exits
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

volumes:
  data:
